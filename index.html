<style>
:root{--bg:#9bbc0f;--card:#8bac0f;--tx:#0f380f;--mut:#306230;--ac:#0f380f;--acx:#9bbc0f;--ln:#306230;--g:#0f380f;--gb:#0f380f;--r:#0f380f;--rb:#8bac0f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f380f;--card:#1c4a14;--tx:#9bbc0f;--mut:#8bac0f;--ac:#9bbc0f;--acx:#0f380f;--ln:#306230;--g:#9bbc0f;--gb:#9bbc0f;--r:#9bbc0f;--rb:#1c4a14}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f380f;--card:#1c4a14;--tx:#9bbc0f;--mut:#8bac0f;--ac:#9bbc0f;--acx:#0f380f;--ln:#306230;--g:#9bbc0f;--gb:#9bbc0f;--r:#9bbc0f;--rb:#1c4a14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-size:var(--fs,21px);line-height:1.15;font-family:var(--fb,"VT323",ui-monospace,"Courier New",monospace);background-color:var(--bg);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
#app{max-width:560px;margin:0 auto;padding:14px}
h1,h2,h3{margin:.4em 0 .6em;line-height:1.4;font-family:var(--fh,"Press Start 2P",ui-monospace,monospace);font-weight:var(--fw,400);text-transform:var(--tt,uppercase)}
h2{font-size:var(--h2,.8rem)}h3{font-size:var(--h3,.68rem)}
.card{background:var(--card);border:var(--bw,3px) solid var(--bc,var(--tx));border-radius:var(--rad,0);box-shadow:var(--sh,4px 4px 0 var(--ln));padding:12px;margin:0 4px 14px 0}
.mut{color:var(--mut);font-size:.88rem}
.g{color:var(--g)}.r{color:var(--r)}
.big{font-family:var(--fh,"Press Start 2P",ui-monospace,monospace);font-size:var(--bigs,.9rem);font-weight:var(--fw,400);text-transform:var(--tt,uppercase)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
button{font:inherit;text-transform:var(--tt,uppercase);border:var(--bw,3px) solid var(--bc,var(--tx));background:var(--card);color:var(--tx);border-radius:var(--brad,0);box-shadow:var(--sh,3px 3px 0 var(--ln));padding:8px 12px;min-height:44px}
button:active{transform:translate(2px,2px);box-shadow:none}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.s{min-height:36px;padding:6px 10px;font-size:.9rem}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:var(--bw2,2px) solid var(--bc,var(--tx));border-radius:var(--brad,0);padding:6px 8px;min-height:44px;width:100%}
.row{display:grid;grid-template-columns:44px 1fr 1fr 64px 40px;gap:6px;align-items:center;margin:6px 0;padding:4px;border-radius:8px;border:1px solid transparent}
.row.g{background:var(--gbg,var(--tx));color:var(--gfg,var(--bg));border-color:var(--gbd,transparent)}.row.g .tag{color:var(--gfg,var(--bg))}.row.r{background:var(--rbg,repeating-linear-gradient(135deg,transparent 0 6px,var(--ln) 6px 8px));border:var(--rbd,2px dashed var(--tx))}
.row.w{opacity:.75}
.tag{font-size:.8rem;color:var(--mut);text-align:center}
.x{padding:0;min-height:36px}
.chip{display:inline-block;border:var(--bw2,2px) solid var(--bc,var(--tx));border-radius:var(--brad,0);padding:4px 10px;margin:2px;font-size:.95rem;text-transform:var(--tt,uppercase)}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.pl{display:grid;grid-template-columns:1fr 56px 56px 56px 40px;gap:6px;margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:4px solid var(--bc,var(--tx));padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;box-shadow:none;background:none;min-height:56px;font-family:var(--fh,"Press Start 2P",ui-monospace,monospace);font-size:var(--nvs,.5rem);color:var(--mut);padding:4px 2px}
nav button.on{background:var(--ac);color:var(--acx)}
svg{width:100%;height:auto}
.ln{stroke:var(--ac);fill:none;stroke-width:2.5}.dt{fill:var(--ac)}.ax{stroke:var(--ln)}.lb{fill:var(--mut);font-size:14px}.bp{fill:none;stroke:var(--tx);stroke-width:2;stroke-dasharray:3 2}.bd{fill:var(--ac)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(15,56,15,.07) 0 1px,transparent 1px 3px)}
:root[data-t="cyber"] body::after,:root[data-t="day"] body::after,:root[data-t="gym"] body::after{display:none}
:root[data-t="cyber"]{color-scheme:dark;--bg:#0a0d10;--card:#12171c;--tx:#d9e2ea;--mut:#7f8c99;--ac:#ffd400;--acx:#0a0d10;--ln:#2a333c;--g:#22d3ee;--r:#ff5a47;--gbg:#06323a;--gfg:#d7f8ff;--gbd:#22d3ee;--rbg:#3a0f0b;--rbd:2px solid #ff5a47;--bc:#3d4a56;--bw:2px;--bw2:2px;--rad:0;--brad:0;--sh:none;--fb:"Rajdhani",system-ui,sans-serif;--fh:"Orbitron",system-ui,sans-serif;--fs:20px;--fw:700;--h2:1rem;--h3:.85rem;--bigs:1.1rem;--nvs:.65rem}
:root[data-t="cyber"] h2,:root[data-t="cyber"] h3,:root[data-t="cyber"] .big{color:var(--ac)}
:root[data-t="cyber"] nav{border-top-color:var(--ac)}
:root[data-t="cyber"] .card{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));margin-right:0}
:root[data-t="day"]{color-scheme:light;--bg:#f4f5f7;--card:#fff;--tx:#1c2430;--mut:#667085;--ac:#2563eb;--acx:#fff;--ln:#d7dce3;--g:#15803d;--r:#b91c1c;--gbg:#dcfce7;--gfg:#14532d;--gbd:#86efac;--rbg:#fee2e2;--rbd:1px solid #fca5a5;--bc:#d7dce3;--bw:1px;--bw2:1px;--rad:12px;--brad:8px;--sh:0 1px 2px rgba(0,0,0,.06);--fb:system-ui,-apple-system,"Segoe UI",sans-serif;--fh:system-ui,-apple-system,"Segoe UI",sans-serif;--fs:17px;--fw:700;--tt:none;--h2:1.25rem;--h3:1.05rem;--bigs:1.4rem;--nvs:.8rem}
:root[data-t="day"] nav{border-top-width:1px}
@media (prefers-color-scheme:dark){:root[data-t="day"]{color-scheme:dark;--bg:#0f141a;--card:#18202a;--tx:#e6ebf0;--mut:#98a2b3;--ac:#60a5fa;--acx:#0b1220;--ln:#2a3441;--g:#4ade80;--r:#f87171;--gbg:#12351f;--gfg:#d7f5e0;--gbd:#2f7d4a;--rbg:#3b1a1a;--rbd:1px solid #7f2d2d;--bc:#2a3441}}
:root[data-t="amber"]{color-scheme:dark;--bg:#0b0700;--card:#140d02;--tx:#ffb000;--mut:#b57a00;--ac:#ffb000;--acx:#0b0700;--ln:#5c3b00;--g:#ffb000;--r:#ffb000;--bc:#ffb000;--bw:2px;--bw2:2px;--rad:0;--brad:0;--sh:0 0 10px rgba(255,176,0,.25);--fb:"VT323",ui-monospace,monospace;--fh:"VT323",ui-monospace,monospace;--fs:21px;--fw:400;--h2:1.5rem;--h3:1.25rem;--bigs:1.7rem;--nvs:1.1rem}

:root[data-t="gym"] h2,:root[data-t="gym"] h3,:root[data-t="gym"] .big{color:var(--ac)}

:root[data-t="lime"]{color-scheme:dark;--bg:#151517;--card:#25262a;--tx:#f2f3f0;--mut:#9a9ca3;--ac:#d4ff4f;--acx:#151517;--ln:#34353a;--bc:#34353a;--g:#d4ff4f;--r:#ff8a7a;--gbg:#2e3a14;--gfg:#f2ffd0;--gbd:#d4ff4f;--rbg:#3b2220;--rbd:1px solid #ff8a7a}
:root[data-t="orange"]{color-scheme:dark;--bg:#171513;--card:#262321;--tx:#f4efe9;--mut:#a39a90;--ac:#d97757;--acx:#1a1411;--ln:#38332f;--bc:#38332f;--g:#e8a27f;--r:#e06c75;--gbg:#3a2a20;--gfg:#ffe9dc;--gbd:#d97757;--rbg:#3b1f22;--rbd:1px dashed #e06c75}
:root[data-t="white"]{color-scheme:light;--bg:#f1f2ee;--card:#fff;--tx:#17171a;--mut:#6b6d73;--ac:#d4ff4f;--acx:#17171a;--ln:#e0e2dc;--bc:#e0e2dc;--g:#4f7a00;--r:#c0392b;--gbg:#eaffb3;--gfg:#17171a;--gbd:#b5e61d;--rbg:#ffe3df;--rbd:1px solid #f08a7d;--sh:0 1px 3px rgba(0,0,0,.06)}
:root[data-t="white"] .ln{stroke:#17171a}:root[data-t="white"] .dt{fill:#17171a}:root[data-t="white"] .bd{fill:#b5e61d;stroke:#17171a;stroke-width:1}
:root[data-t="lime"] body::after,:root[data-t="orange"] body::after,:root[data-t="white"] body::after{display:none}
:root[data-t="lime"] body,:root[data-t="orange"] body,:root[data-t="white"] body{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
:root[data-t="lime"] nav,:root[data-t="orange"] nav,:root[data-t="white"] nav{margin:0 10px calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--ln);border-radius:24px;padding-bottom:0}
:root[data-t="lime"] nav button,:root[data-t="orange"] nav button,:root[data-t="white"] nav button{border-radius:18px;margin:4px;min-height:48px}
textarea{min-height:140px;font:12px/1.3 ui-monospace,monospace}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
const K='ft_v1',STEP=2.5;
let S,tab='t',exSel=null,confirmImp=false,exMet='w',confDef=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const key=n=>String(n).trim().toLowerCase();
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const dm=d=>{const p=d.split('-');return +p[2]+'. '+ +p[1]+'.'};
const DEF={"workouts":[{"id":"384ua93","name":"Push A","archived":false,"ex":[{"name":"Lateral Raise","sets":4,"min":10,"max":15},{"name":"Flat DB Press","sets":3,"min":8,"max":12},{"name":"Incline DB Chest Press","sets":3,"min":8,"max":12},{"name":"Pec Deck Fly","sets":2,"min":10,"max":15},{"name":"Reverse Pec Deck Fly","sets":3,"min":12,"max":20},{"name":"Triceps Pushdown SA","sets":4,"min":12,"max":20},{"name":"Abdominal Crunch","sets":4,"min":10,"max":15}]},{"id":"bnoev8w","name":"Pull A","archived":false,"ex":[{"name":"Lat pulldown SA","sets":3,"min":8,"max":12},{"name":"Upper Back Row","sets":2,"min":8,"max":12},{"name":"Lateral Row SA","sets":3,"min":10,"max":15},{"name":"Upper Back Row","sets":2,"min":12,"max":20},{"name":"Preacher Curl (Machine)","sets":3,"min":10,"max":15},{"name":"Hammer Curl (Cable)","sets":3,"min":10,"max":15},{"name":"Wrist Curl (DB)","sets":2,"min":12,"max":15}]},{"id":"t17ic3w","name":"Legs A","archived":false,"ex":[{"name":"Lying Hamstring Curl","sets":4,"min":8,"max":12},{"name":"Squat Machine","sets":2,"min":8,"max":12},{"name":"Leg press","sets":3,"min":12,"max":20},{"name":"Adductor","sets":2,"min":10,"max":15},{"name":"Leg Extension","sets":3,"min":10,"max":15},{"name":"Calf Raise (Machine)","sets":4,"min":12,"max":16}]},{"id":"ygsh9om","name":"Push B","archived":false,"ex":[{"name":"Lateral Raise","sets":4,"min":10,"max":15},{"name":"Shoulder Press (Machine)","sets":3,"min":8,"max":12},{"name":"Close Grip Press (Machine)","sets":3,"min":8,"max":12},{"name":"Reverse Cable Fly SA","sets":3,"min":10,"max":15},{"name":"Pec Deck Fly","sets":3,"min":10,"max":15},{"name":"Overhead Tricep Extension","sets":4,"min":10,"max":15},{"name":"Abdominal Crunch","sets":4,"min":10,"max":15}]},{"id":"xq2zzhf","name":"Pull B","archived":false,"ex":[{"name":"Upper Back Pulldown","sets":3,"min":10,"max":15},{"name":"Upper Back Row","sets":3,"min":8,"max":12},{"name":"Lateral Row","sets":2,"min":8,"max":12},{"name":"Lat pulldown SA","sets":2,"min":12,"max":20},{"name":"Cable Curl","sets":3,"min":10,"max":15},{"name":"Hammer Curl (Preacher DB)","sets":3,"min":10,"max":15},{"name":"Wrist Curl (DB)","sets":2,"min":10,"max":15}]},{"id":"rd12zau","name":"Legs B","archived":false,"ex":[{"name":"Lying Hamstring Curl","sets":4,"min":8,"max":12},{"name":"Romanian deadlift","sets":2,"min":8,"max":12},{"name":"Split Squat","sets":3,"min":10,"max":15},{"name":"Adductor","sets":3,"min":10,"max":15},{"name":"Calf Raise (Machine)","sets":4,"min":6,"max":10}]}],"cycle":["384ua93","bnoev8w","t17ic3w","off","ygsh9om","xq2zzhf","rd12zau","off"],"ci":0,"logs":[],"cur":null,"archive":[],"pname":"Trénink","lib":["Lateral Raise","Triceps pushdown","Barbell row","Lat pulldown SA","Bicep curl","Squat Machine","Romanian deadlift","Flat DB Press","Incline Chest Press","Incline DB Chest Press","Pec Deck Fly","Reverse Pec Deck Fly","Reverse Cable Fly SA","Triceps Pushdown SA","Upper Back Row","Lateral Row","Lateral Row SA","Preacher Curl (Machine)","Preacher Curl (Cable)","Preacher Curl (DB)","Hammer Curl (DB)","Hammer Curl (Cable)","Lying Hamstring Curl","Leg Press","Adductor","Leg Extension","Calf Raise (Machine)","Shoulder Press (Machine)","Close Grip Press (Machine)","Overhead Tricep Extension","Abdominal Crunch","Split Squat","Wrist Curl (Cable)","Wrist Curl (DB)","Upper Back Pulldown","Cable Curl","Hammer Curl (Preacher DB)"]};
function seed(){return JSON.parse(JSON.stringify(DEF))}
function seedOld(){
  const w=(n,ex)=>({id:uid(),name:n,archived:false,ex:ex.map(([name,sets,min,max])=>({name,sets,min,max}))});
  const a=w('Push',[['Bench press',3,6,10],['Overhead press',3,6,10],['Triceps pushdown',3,10,15]]);
  const b=w('Pull',[['Barbell row',3,6,10],['Lat pulldown',3,8,12],['Bicep curl',3,15,20]]);
  const c=w('Legs',[['Squat',3,6,10],['Romanian deadlift',3,8,12],['Leg press',3,10,15]]);
  return {workouts:[a,b,c],cycle:[a.id,b.id,c.id,'off'],ci:0,logs:[],cur:null};
}
function load(){try{navigator.storage.persist()}catch(e){}try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}if(!S||!S.workouts)S=seed();S.archive=S.archive||[];S.pname=S.pname||'Program 1';if(!S.lib){S.lib=[];[...S.workouts,...S.archive.flatMap(a=>a.workouts)].forEach(w=>w.ex.forEach(x=>addLib(x.name)));S.logs.forEach(l=>l.entries.forEach(e=>addLib(e.name)))}}
function addLib(n){n=String(n).trim();if(n&&!S.lib.some(x=>key(x)===key(n)))S.lib.push(n)}
const sortL=()=>[...S.lib].sort((a,b)=>a.localeCompare(b,'cs'));
function libSel(cur,fn,ph){const L=sortL();if(cur&&!L.some(x=>key(x)===key(cur)))L.push(cur);return `<select onchange="${fn}">${ph?`<option value="">${ph}</option>`:''}${L.map(n=>`<option value="${esc(n)}"${cur&&key(n)===key(cur)?' selected':''}>${esc(n)}</option>`).join('')}</select>`}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const wById=id=>S.workouts.find(w=>w.id===id);

/* ---------- history & logic ---------- */
function hist(name){const k=key(name),o=[];for(const l of S.logs)for(const e of l.entries)if(key(e.name)===k)o.push({date:l.date,sets:e.sets.filter(s=>!s.warm)});return o}
function lastSets(name){const h=hist(name);return h.length?h[h.length-1].sets:[]}
// Dvojitá progrese: první pracovní série na nejvyšší váze; nad polovinou rozsahu -> přidat váhu
function sug(x){
  const l=lastSets(x.name);if(!l.length)return null;
  const top=Math.max(...l.map(s=>s.w)),f=l.find(s=>s.w===top),mid=(x.min+x.max)/2;
  if(f.r>mid)return {w:+(top+stepOf(x.name)).toFixed(2),r:x.min,up:true};
  return {w:top,r:Math.min(f.r+1,x.max),up:false};
}
function vol(l){let v=0;for(const e of l.entries)for(const s of e.sets)if(!s.warm)v+=s.w*s.r;return v}
function trend(wid){
  const ls=S.logs.filter(l=>l.wid===wid);if(ls.length<2)return '<span class="mut">–</span>';
  const a=vol(ls[ls.length-1]),b=vol(ls[ls.length-2]);
  return a>b*1.01?'<span class="g">▲</span>':a<b*.99?'<span class="r">▼</span>':'<span class="mut">▬</span>';
}
function wIdx(e,si){let n=0;for(let i=0;i<=si;i++)if(!e.sets[i].warm)n++;return n}
function cls(e,si){
  const s=e.sets[si];if(S.cur&&S.cur.retro)return '';if(s.warm||!(+s.r>0)||!(+s.w>0))return '';
  const l=lastSets(e.name);if(!l.length)return '';
  const w=+s.w,r=+s.r;
  if(w>Math.max(...l.map(x=>x.w)))return 'g';
  const wi=wIdx(e,si)-1,same=l.filter(x=>x.w===w);if(!same.length)return '';
  const ref=(l[wi]&&l[wi].w===w)?l[wi]:same[0];
  return r>ref.r?'g':r<ref.r?'r':'';
}
const fmtSets=a=>a.length?a.map(s=>s.w+'×'+s.r).join(', '):'bez historie';

/* ---------- week chart ---------- */
function weekChart(){
  const now=new Date(),dow=(now.getDay()+6)%7,nm=['Po','Út','St','Čt','Pá','So','Ne'];
  const mon=new Date(now);mon.setDate(now.getDate()-dow);
  const ps=w=>w?w.ex.reduce((a,x)=>a+x.sets,0):0;
  const off0=S.logs.some(l=>l.date===today()&&!l.old)?1:0;
  const cols=[];
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const lg=S.logs.filter(l=>l.date===iso(d)&&!l.old);
    let done=0,plan=0,off=false;
    if(lg.length){lg.forEach(l=>{l.entries.forEach(e=>e.sets.forEach(s=>{if(!s.warm)done++}));plan+=ps(wById(l.wid))});plan=Math.max(plan,done)}
    else if(i>=dow&&S.cycle.length){const id=S.cycle[(S.ci+i-dow-off0)%S.cycle.length];if(id==='off')off=true;else plan=ps(wById(id))}
    else off=true;
    cols.push({n:nm[i],done,plan,off,now:i===dow});
  }
  const mx=Math.max(1,...cols.map(c=>Math.max(c.plan,c.done))),H=105;
  let s='<svg viewBox="0 0 320 150" role="img" aria-label="Týdenní přehled sérií">';
  cols.forEach((c,i)=>{
    const x=10+i*44,hp=c.plan/mx*H,hd=c.done/mx*H;
    s+=`<rect class="bp" x="${x}" y="${125-hp}" width="30" height="${hp}" rx="3"/><rect class="bd" x="${x+5}" y="${125-hd}" width="20" height="${hd}" rx="3"/>`;
    if(c.off)s+=`<text class="lb" x="${x+15}" y="118" text-anchor="middle" style="font-size:12px">day off</text>`;
    s+=`<text class="lb" x="${x+15}" y="143" text-anchor="middle"${c.now?' style="font-weight:700;fill:var(--tx)"':''}>${c.n}</text>`;
  });
  return s+'</svg>';
}

/* ---------- training ---------- */
function start(wid){
  const w=wById(wid);
  S.cur={wid,name:w.name,entries:w.ex.map(x=>{const g=sug(x);return {name:x.name,min:x.min,max:x.max,sets:Array.from({length:x.sets},()=>({w:g?g.w:'',r:'',rir:'',warm:false}))}})};
  save();render();window.scrollTo(0,0);
}
function pick(i){S.ci=i;save();render()}
function cancelW(){const r=S.cur&&S.cur.retro;S.cur=null;if(r){tab='s';histSel='list'}save();render()}
function skipDay(){S.ci=(S.ci+1)%S.cycle.length;save();render()}
function finish(){
  const c=S.cur;
  const entries=c.entries.map(e=>({name:e.name,sets:e.sets.filter(s=>+s.w>0&&+s.r>0).map(s=>({w:+s.w,r:+s.r,rir:s.rir===''?null:+s.rir,warm:!!s.warm}))})).filter(e=>e.sets.some(s=>!s.warm));
  if(entries.length){S.logs.push({id:uid(),date:c.retro?c.date:today(),wid:c.wid,entries,old:c.retro?1:undefined});if(c.retro)S.logs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);else{const i=S.cycle.indexOf(c.wid);if(i>=0)S.ci=(i+1)%S.cycle.length}}
  S.cur=null;if(c.retro){tab='s';histSel='list'}save();render();
}
function upd(ei,si,f,el){
  const e=S.cur.entries[ei];e.sets[si][f]=el.value;save();
  for(let i=0;i<e.sets.length;i++){const d=$('#r'+ei+'_'+i);if(d)d.className='row '+(e.sets[i].warm?'w ':'')+cls(e,i)}
}
function swapEx(ei,n){
  if(!n)return;const e=S.cur.entries[ei];e.name=n;e.sets=e.sets.filter(s=>!s.warm);
  const g=sug({name:n,min:e.min,max:e.max});
  e.sets.forEach(s=>{s.w=g?g.w:'';s.r='';s.rir=''});save();render();
}
function addSet(ei){const e=S.cur.entries[ei];const l=[...e.sets].reverse().find(s=>!s.warm);e.sets.push({w:l?l.w:'',r:'',rir:'',warm:false});save();render()}
function addWarm(ei){const e=S.cur.entries[ei];const f=e.sets.find(s=>!s.warm);const h=f&&+f.w>0?Math.round(f.w/2*2)/2:'';e.sets.unshift({w:h,r:'',rir:'',warm:true});save();render()}
function delSet(ei,si){S.cur.entries[ei].sets.splice(si,1);save();render()}
function rowH(ei,si){
  const e=S.cur.entries[ei],s=e.sets[si];
  return `<div class="row ${s.warm?'w ':''}${cls(e,si)}" id="r${ei}_${si}"><span class="tag">${s.warm?'zahř.':wIdx(e,si)+'.'}</span>
<input type="number" inputmode="decimal" placeholder="kg" value="${esc(s.w)}" oninput="upd(${ei},${si},'w',this)">
<input type="number" inputmode="numeric" placeholder="opak." value="${esc(s.r)}" oninput="upd(${ei},${si},'r',this)">
<input type="number" inputmode="numeric" placeholder="RIR" value="${esc(s.rir)}" oninput="upd(${ei},${si},'rir',this)">
<button class="x" onclick="delSet(${ei},${si})" aria-label="Smazat sérii">✕</button></div>`;
}
function vActive(){
  const c=S.cur;
  let h=`<div class="bar sp"><h2>${esc(c.name)}</h2><button onclick="cancelW()" class="s">Zrušit</button></div>`+(c.retro?`<div class="card"><div class="mut">Starý trénink: zapiš, co jsi tehdy zvedl. Datum:</div><input type="date" value="${c.date}" max="${today()}" onchange="S.cur.date=this.value;save()"></div>`:'');
  c.entries.forEach((e,ei)=>{
    const l=c.retro?[]:lastSets(e.name),g=c.retro?null:sug({name:e.name,min:e.min,max:e.max});
    h+=`<div class="card"><h3>${esc(e.name)} <span class="mut">(${e.min}–${e.max} opak.)</span></h3>
${c.retro?'':`<div class="mut">Minule: ${esc(fmtSets(l))}</div>`}<input placeholder="Poznámka (sedák, nastavení…)" value="${esc(S.note[key(e.name)]||'')}" data-n="${esc(e.name)}" onchange="S.note[key(this.dataset.n)]=this.value;save()" style="margin:6px 0">
${g?`<div class="mut">Návrh: <b>${g.w} kg</b>, cíl ${g.r}+ opak. ${g.up?'<span class="g">(přidat váhu)</span>':''}</div>`:''}
${e.sets.map((_,si)=>rowH(ei,si)).join('')}
<div class="bar"><button class="s" onclick="addSet(${ei})">+ série</button><button class="s" onclick="addWarm(${ei})">+ zahřívací</button></div><div style="margin-top:8px">${libSel('','swapEx('+ei+',this.value)','Vyměnit cvik jen dnes…')}</div></div>`;
  });
  return h+`<button class="p" style="width:100%" onclick="finish()">${c.retro?'Uložit do historie':'Dokončit trénink'}</button>`;
}
function vHome(){
  if(S.cur)return vActive();
  const act=S.workouts.filter(w=>!w.archived);
  const nid=S.cycle[S.ci],nw=nid&&nid!=='off'?wById(nid):null;
  let h=backupNote()+'<h2>Další v rotaci</h2><div class="card">';
  if(!S.cycle.length)h+='<div class="mut">Rotace je prázdná. Přidej tréninky v záložce Plány.</div>';
  else if(nw)h+=`<div class="bar sp"><div><div class="big">${esc(nw.name)} ${trend(nw.id)}</div><div class="mut">${S.logs.filter(l=>l.wid===nw.id).length}× odtrénováno</div></div><button class="p" onclick="start('${nw.id}')">Začít</button></div>`;
  else h+=`<div class="bar sp"><div class="big">Volno</div><button onclick="skipDay()">Přeskočit den</button></div>`;
  if(S.cycle.length)h+='<div style="margin-top:8px">'+S.cycle.map((id,i)=>`<span class="chip ${i===S.ci?'on':''}" onclick="pick(${i})" style="cursor:pointer;padding:10px 14px">${id==='off'?'volno':esc((wById(id)||{name:'?'}).name)}</span>`).join('')+'</div><div class="mut" style="margin-top:4px">Klepnutím vyber, co je na řadě.</div>';
  h+='</div><div class="card"><h3>Tento týden</h3><div class="mut">Série: světlé = plán, barevné = hotovo</div>'+weekChart()+'</div><h2>Jiný trénink</h2>';
  h+=act.map(w=>`<div class="card bar sp"><div><b>${esc(w.name)}</b> ${trend(w.id)}<div class="mut">${w.ex.length} cviků</div></div><button onclick="start('${w.id}')">Začít</button></div>`).join('')||'<div class="mut">Žádné aktivní tréninky.</div>';
  return h;
}

/* ---------- plans ---------- */
function ren(i,v){S.workouts[i].name=v.trim()||S.workouts[i].name;save();render()}
function setEx(wi,xi,f,v){const x=S.workouts[wi].ex[xi];if(f==='name')x.name=v.trim()||x.name;else{const n=Math.max(1,parseInt(v)||x[f]);x[f]=n;if(x.min>x.max){if(f==='min')x.max=x.min;else x.min=x.max}}save();render()}
function delEx(wi,xi){S.workouts[wi].ex.splice(xi,1);save();render()}
function addEx(wi){const n=sortL()[0]||'Nový cvik';addLib(n);S.workouts[wi].ex.push({name:n,sets:3,min:8,max:12});save();render()}
function newW(){const w={id:uid(),name:'Nový trénink',archived:false,ex:[]};S.workouts.push(w);save();render()}
function arch(i){
  const w=S.workouts[i];w.archived=!w.archived;
  if(w.archived){S.cycle=S.cycle.filter(id=>id!==w.id);if(S.ci>=S.cycle.length)S.ci=0}
  save();render();
}
function archProg(){
  S.cur=null;
  if(S.workouts.length||S.cycle.length)S.archive.push({name:S.pname,workouts:S.workouts,cycle:S.cycle,ci:S.ci});
  S.workouts=[];S.cycle=[];S.ci=0;S.pname='Nový program';save();render();
}
function restProg(i){
  S.cur=null;const a=S.archive.splice(i,1)[0];
  if(S.workouts.length||S.cycle.length)S.archive.push({name:S.pname,workouts:S.workouts,cycle:S.cycle,ci:S.ci});
  S.workouts=a.workouts;S.cycle=a.cycle;S.ci=a.ci||0;S.pname=a.name;save();render();
}
function libAdd(){addLib($('#newex').value);save();render()}
function libDel(n){S.lib=S.lib.filter(x=>x!==n);save();render()}
function libRen(o,v){
  v=v.trim();if(!v||v===o)return;
  if(S.lib.some(x=>key(x)===key(v)&&x!==o)){render();return}
  const k=key(o),ch=e=>{if(key(e.name)===k)e.name=v};
  S.lib=S.lib.map(x=>x===o?v:x);['mg','step','note'].forEach(f=>{if(S[f]&&S[f][k]!==undefined){S[f][key(v)]=S[f][k];delete S[f][k]}});
  [...S.workouts,...S.archive.flatMap(a=>a.workouts)].forEach(w=>w.ex.forEach(ch));
  S.logs.forEach(l=>l.entries.forEach(ch));
  if(S.cur)S.cur.entries.forEach(ch);
  save();render();
}

function chart(h){
  if(h.length<2)return '<div class="mut">Graf se objeví po dvou tréninkách tohoto cviku.</div>';
  const f=exMet==='v'?x=>x.sets.reduce((a,s)=>a+s.w*s.r,0):exMet==='e'?x=>Math.max(...x.sets.map(s=>s.w*(1+s.r/30))):x=>Math.max(...x.sets.map(s=>s.w));const v=h.map(x=>Math.round(f(x)*10)/10),mn=Math.min(...v),mx=Math.max(...v),W=320,H=140,p=28,rg=mx-mn||1;
  const pt=v.map((y,i)=>[p+i*(W-2*p)/(v.length-1),H-p-(y-mn)/rg*(H-2*p)]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Nejvyšší váha v čase"><line class="ax" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/><polyline class="ln" points="${pt.map(q=>q.join(',')).join(' ')}"/>${pt.map(q=>`<circle class="dt" cx="${q[0]}" cy="${q[1]}" r="3.5"/>`).join('')}<text class="lb" x="2" y="${pt[0][1]+4}">${v[0]}</text><text class="lb" x="${W-2}" y="${pt[pt.length-1][1]-8}" text-anchor="end">${v[v.length-1]} kg</text></svg>`;
}
function vStats(){
  if(histSel!==null)return vHist();
  if(exSel){
    const h=hist(exSel);
    return `<button class="s" onclick="exSel=null;render()">← Zpět</button><h2>${esc(exSel)}</h2><div class="card"><div class="bar" style="margin-bottom:8px">${[['w','Váha'],['v','Objem'],['e','Odhad 1RM']].map(([k,n])=>`<button class="s ${exMet===k?'p':''}" onclick="exMet='${k}';render()">${n}</button>`).join('')}</div>${chart(h)}<div class="mut">Rekord váhy: ${Math.max(...h.flatMap(x=>x.sets.map(s=>s.w)))} kg · odhad 1RM podle Epleyho vzorce</div></div><div class="card">`+h.slice().reverse().map(x=>`<div style="margin:6px 0"><b>${dm(x.date)}</b> <span class="mut">${esc(fmtSets(x.sets))}</span></div>`).join('')+'</div>';
  }
  const names={};for(const l of S.logs)for(const e of l.entries)names[key(e.name)]=e.name;
  const ks=Object.keys(names).sort();
  let h='<h2>Statistiky</h2><button class="s" onclick="histSel=\'list\';render()">Historie tréninků</button>';
  if(!ks.length)return h+'<div class="card mut">Zatím žádné tréninky. Po prvním dokončeném tréninku se tu objeví cviky. Máš starší záznamy? Přidej je v Historii tréninků.</div>';
  window.__ks=ks.map(k=>names[k]);
  return h+ks.map((k,ki)=>{const hh=hist(names[k]),l=hh[hh.length-1];return `<div class="card bar sp" onclick="exSel=window.__ks[${ki}];render()" style="cursor:pointer"><div><b>${esc(names[k])}</b><div class="mut">${hh.length}× · minule ${esc(fmtSets(l.sets))}</div></div><span>›</span></div>`}).join('');
}

let expDays=56;
function setP(d){expDays=d;render()}
function aiText(){
  const since=expDays?iso(new Date(Date.now()-expDays*864e5)):'';
  const L=S.logs.filter(l=>!since||l.date>=since);
  const nm=id=>id==='off'?'volno':(wById(id)||{name:'?'}).name;
  const fs=s=>s.w+'×'+s.r+(s.rir!=null?'('+s.rir+')':'');
  const top=a=>Math.max(...a.map(s=>s.w)),e1=a=>Math.max(...a.map(s=>s.w*(1+s.r/30))),vl=a=>a.reduce((t,s)=>t+s.w*s.r,0);
  let t=''+aiHead()+'\n\n';
  t+='PROGRAM: '+S.pname+'\nROTACE: '+S.cycle.map(nm).join(' > ')+'\n';
  t+='PRAVIDLA: dvojitá progrese; váhu přidávám o krok uvedený u cviku (výchozí '+STEP+' kg), když první pracovní série na nejvyšší váze překročí polovinu rozsahu opakování, jinak přidávám opakování. Zahřívací série v datech nejsou. Zápis série: kg×opakování(RIR).\n';
  t+='PLÁN TRÉNINKŮ:\n'+S.workouts.filter(w=>!w.archived).map(w=>'- '+w.name+': '+w.ex.map(x=>x.name+' '+x.sets+'×'+x.min+'–'+x.max).join('; ')).join('\n')+'\n';
  const wk=expDays?expDays/7:(L.length?Math.max(1,(Date.now()-new Date(L[0].date))/6048e5):1);
  t+='\nOBDOBÍ: '+(expDays?'posledních '+expDays/7+' týdnů':'celá historie')+'; tréninků: '+L.length+' (průměr '+(L.length/wk).toFixed(1)+' za týden)\n';
  const names={};L.forEach(l=>l.entries.forEach(e=>{names[key(e.name)]=e.name}));
  const gs={};L.forEach(l=>l.entries.forEach(e=>{const g=S.mg[key(e.name)]||'Ostatní';gs[g]=(gs[g]||0)+e.sets.filter(s=>!s.warm).length}));
  t+='PRŮMĚRNÝ TÝDENNÍ POČET PRACOVNÍCH SÉRIÍ NA SVALOVOU SKUPINU: '+Object.keys(gs).sort((a,b)=>gs[b]-gs[a]).map(g=>g+' '+(gs[g]/wk).toFixed(1)).join(', ')+'\n';
  Object.keys(names).sort().forEach(k=>{
    const ses=[];L.forEach(l=>l.entries.forEach(e=>{if(key(e.name)===k){const w=e.sets.filter(s=>!s.warm);if(w.length)ses.push({d:l.date,s:w})}}));
    if(!ses.length)return;
    const a=ses[0].s,b=ses[ses.length-1].s;
    t+='\n## '+names[k]+' ['+(S.mg[k]||'')+', krok '+stepOf(names[k])+' kg'+(S.note[k]?', poznámka: '+S.note[k]:'')+'] ('+ses.length+'× | nejvyšší váha '+top(a)+' → '+top(b)+' kg | odhad 1RM '+Math.round(e1(a))+' → '+Math.round(e1(b))+' kg | objem '+Math.round(vl(a))+' → '+Math.round(vl(b))+' kg)\n';
    ses.forEach(x=>{t+=x.d+': '+x.s.map(fs).join(', ')+'\n'});
  });
  if(!L.length)t+='\n(V tomto období nejsou žádné zaznamenané tréninky.)\n';
  return t;
}

function aiHead(){return ['Jednej jako zkušený trenér silového tréninku a hypertrofie, který se opírá o důkazy a data. Cílem je maximální dlouhodobý pokrok podle mého profilu a omezení. Pracuj jen s daty níže, nic si nevymýšlej a nechval mě zbytečně: když je něco špatně, řekni to přímo. Pokud data na závěr nestačí (málo tréninků, chybí RIR), napiš to a řekni, co mám zapisovat.','','ÚKOLY:','1. Progres po cviku: roste váha, opakování, odhad 1RM nebo objem? Označ cviky, které rostou, stagnují (3 a více tréninků bez pokroku) nebo klesají, a navrhni pravděpodobnou příčinu.','2. Správnost navyšování: dodržuji dvojitou progresi? Přidávám váhu příliš brzy nebo pozdě?','3. Objem a rozložení: porovnej průměrný týdenní počet pracovních sérií na svalovou skupinu s běžně doporučovanými rozsahy pro můj cíl a zkušenost. Ukaž přebytky i mezery.','4. Intenzita a únava: využij RIR, pokud je zapsán. Posuď, zda trénuji dost blízko selhání a zda je vhodný deload.','5. Frekvence a pravidelnost: dodržuji plán a jak často trénuje každá partie?','6. Výběr cviků a struktura: navrhni konkrétní změny (přidat, ubrat, vyměnit, upravit série a rozsah opakování), jen když mají oporu v datech.','','FORMÁT ODPOVĚDI: (a) shrnutí na 3 až 5 vět, (b) tabulka cviků se stavem a doporučením, (c) tři nejdůležitější priority v pořadí, (d) konkrétní plán na další 2 týdny s váhami a opakováními u každého cviku, (e) co mám sledovat nebo zapisovat navíc. Odpovídej česky, stručně a konkrétně. Nejsi lékař: při bolesti nebo zranění mě odkaž na odborníka.','',profTxt()].join('\n')}

}
function hDate(id,v){const l=S.logs.find(x=>x.id===id);if(l&&v){l.date=v;S.logs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);save();render()}}
function hSet(id,ei,si,f,v){const s=S.logs.find(x=>x.id===id).entries[ei].sets[si];if(v!==''){s[f]=+v}else if(f==='rir')s[f]=null;save()}
function hDel(id,ei,si){const l=S.logs.find(x=>x.id===id);l.entries[ei].sets.splice(si,1);if(!l.entries[ei].sets.length)l.entries.splice(ei,1);if(!l.entries.length){S.logs=S.logs.filter(x=>x!==l);histSel='list'}save();render()}
function hKill(id){if(!confDel){confDel=true;render();return}S.logs=S.logs.filter(x=>x.id!==id);confDel=false;histSel='list';save();render()}
function expFile(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trenink-zaloha-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();S.lastBackup=today();save()}
function impFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp').value=r.result};r.readAsText(f)}
let rD=today(),rW='';
function vRetro(){
  const act=S.workouts.filter(w=>!w.archived);
  if(!rW||!wById(rW))rW=act[0]?act[0].id:'';
  const back=`<button class="s" onclick="histSel='list';render()">← Zpět</button><h2>Starý trénink</h2>`;
  if(S.cur&&!S.cur.retro)return back+'<div class="card mut">Nejdřív dokonči nebo zruš rozdělaný trénink.</div>';
  if(!act.length)return back+'<div class="card mut">Nejdřív vytvoř trénink v Plánech.</div>';
  return back+`<div class="card"><div class="mut">Datum</div><input type="date" value="${rD}" max="${today()}" onchange="rD=this.value"><div class="mut" style="margin-top:8px">Trénink</div><select onchange="rW=this.value">${act.map(w=>`<option value="${w.id}"${w.id===rW?' selected':''}>${esc(w.name)}</option>`).join('')}</select><button class="p" style="width:100%;margin-top:12px" onclick="startRetro()">Pokračovat</button></div>`;
}
function startRetro(){
  if(!rW||!rD)return;const w=wById(rW);
  S.cur={wid:rW,name:w.name,retro:true,date:rD,entries:w.ex.map(x=>({name:x.name,min:x.min,max:x.max,sets:Array.from({length:x.sets},()=>({w:'',r:'',rir:'',warm:false}))}))};
  histSel=null;tab='t';save();render();window.scrollTo(0,0);
}
function expCopy(){const t=$('#exp');t.select();try{navigator.clipboard.writeText(t.value).then(()=>{S.lastBackup=today();save()},()=>{})}catch(e){}}
function imp(){
  const t=$('#imp').value.trim();if(!t)return;
  let d;try{d=JSON.parse(t)}catch(e){alert('Neplatná záloha.');return}
  if(!d.workouts||!d.logs){alert('Neplatná záloha.');return}
  if(!confirmImp){confirmImp=true;render();return}
  S=d;confirmImp=false;save();tab='t';render();
}
function vBackup(){
  return `<h2>Vzhled</h2>${themeCards()}<h2>Profil</h2>${profCard()}<h2>Výstup pro AI</h2>${aiCard()}<h2>Záloha</h2><div class="card"><div class="mut">Data jsou jen v prohlížeči tohoto telefonu. Občas si je zkopíruj a ulož někam bokem (poznámky, e-mail sobě).</div>
<textarea id="exp" readonly>${esc(JSON.stringify(S))}</textarea><button class="p" style="margin-top:8px" onclick="expCopy()">Kopírovat zálohu</button> <button style="margin-top:8px" onclick="expFile()">Stáhnout soubor</button></div>
<div class="card"><h3>Výchozí data</h3><div class="mut">Načte cviky, tréninky a rotaci výchozího programu z této verze stránky. Historie tréninků zůstane.</div><button style="margin-top:8px" onclick="loadDef()">${confDef?'Opravdu přepsat plány?':'Načíst výchozí data'}</button></div>
<div class="card"><h3>Obnovit ze zálohy</h3><input type="file" accept=".json,application/json" onchange="impFile(this)" style="margin-bottom:8px"><textarea id="imp" placeholder="Vlož zálohu sem nebo vyber soubor"></textarea><button style="margin-top:8px" onclick="imp()">${confirmImp?'Opravdu přepsat všechna data?':'Načíst zálohu'}</button></div>`;
}

/* ---------- shell ---------- */
function render(){
  S.theme=S.theme||'day';S.lib=S.lib||[];S.mg=S.mg||{};S.step=S.step||{};S.note=S.note||{};S.profile=S.profile||{};S.lib.forEach(n=>{if(!S.mg[key(n)])S.mg[key(n)]=guess(n)});document.documentElement.setAttribute('data-t',S.theme);
  const v={t:vHome,p:vPlans,s:vStats,b:vBackup}[tab]();
  $('#app').innerHTML=v;
  const items=[['t','Trénink'],['p','Plány'],['s','Statistiky'],['b','Nastavení']];
  $('#nav').innerHTML=items.map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
}
function go(k){tab=k;exSel=null;confirmImp=false;confDef=false;histSel=null;confDel=false;render();window.scrollTo(0,0)}
load();render();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script>
</body>
</html>
